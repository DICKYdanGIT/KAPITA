<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier</title>
    <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.webix.com/edge/webix.js"></script>

</head>

<body style="background-color: pink;">
    <script src="/static/protection.js"></script>
    <script src="/static/cashier/cashier.js"></script>
    <script src="/static/cashier/cart.js"></script>
    <script src="/static/cashier/promo.js"></script>
    <script>
        webix.ready(function () {
            webix.ui({
                cols: [{
                    view: "sidebar",
                    id: "cashierSidebar",
                    width: 220,
                    data: [
                        { id: "cashier", value: "Kasir" },
                        { id: "promo", value: "Promo" },
                        { id: "logout", value: "Logout" }
                    ],

                    on: {
                        onAfterSelect: function (id) {
                            if (id === "logout") {
                                fetch("/auth/logout", {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json"
                                    }
                                })
                                .then(response => {
                                    if (response.redirected) {
                                        window.location.href = response.url;
                                    } else if (response.ok) {
                                        window.location.href = "/auth/login";
                                    } else {
                                        webix.message("Gagal logout");
                                    }
                                })
                                .catch(error => {
                                    console.error(error);
                                    webix.message("Terjadi kesalahan saat logout");
                                })

                                return;
                            }

                        if (id === "promo") {
                            $$("promoContentWindow").show();
                            return;
                        }

                        if (id === "cashier") {
                            $$("promoContentWindow").hide();
                            return;
                        }
                        }
                    }
                },
                {
                    view: "multiview",
                    animate: false,
                    cells: [
                        {
                            id: "cashierContent",
                            cols: [
                                cashierContent(),
                                cartContent()
                            ]
                        }
                    ]
                }
                ]
            });
            webix.ui(cartWindow());
            webix.ui(promoContentWindow());
        });
    </script>
</body>
</html>
